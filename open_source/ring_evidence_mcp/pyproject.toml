[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-evidence-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server exposing Ring Doorbell as a physical evidence oracle for AI agents"
readme = "README.md"
authors = [{ name = "MIRAGE-SHIELD Team", email = "dev@mirage-shield.org" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0"
]

[project.scripts]
ring-evidence-mcp = "open_source.ring_evidence_mcp.server:main"
