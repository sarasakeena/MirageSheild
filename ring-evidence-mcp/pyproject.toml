[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-evidence-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server exposing Ring Doorbell & Camera physical entrance telemetry for AI reasoning agents."
readme = "README.md"
authors = [
    { name = "MIRAGE-SHIELD Open Source Contributors", email = "oss@mirageshield.dev" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ring",
    "doorbell",
    "physical-evidence",
    "ai-agents",
    "anti-scam",
    "digital-arrest"
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ring-evidence-mcp = "ring_evidence_mcp.server:main"

[project.urls]
Homepage = "https://github.com/mirage-shield/ring-evidence-mcp"
Documentation = "https://github.com/mirage-shield/ring-evidence-mcp#readme"
Issues = "https://github.com/mirage-shield/ring-evidence-mcp/issues"
