<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIRAGE-SHIELD | Opening Hook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #07090e;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
    }

    /* Faint architectural background grid */
    .grid-backdrop {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    }

    /* Fixed 1920x1080 stage */
    .title-stage {
      width: 1920px;
      height: 1080px;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px;
      position: relative;
      z-index: 10;
      animation: slowFadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slowFadeIn {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Brand Header: SVG Shield + Wordmark */
    .brand-mark-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
      opacity: 0.85;
    }

    .shield-icon {
      width: 22px;
      height: 22px;
      stroke: #00d2ff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wordmark {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.28em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    /* Core Hero Hook Typography */
    .hero-stat-block {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .hero-number {
      font-size: 108px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #00d2ff;
    }

    .hero-label {
      font-size: 42px;
      font-weight: 400;
      color: #cbd5e1;
      letter-spacing: -0.02em;
      max-width: 900px;
      line-height: 1.25;
    }

    .hero-label strong {
      font-weight: 600;
      color: #ffffff;
    }

    /* Minimal Footnote Context */
    .source-meta {
      position: absolute;
      bottom: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .source-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="grid-backdrop"></div>

  <main class="title-stage">
    <!-- Brand Mark Above -->
    <div class="brand-mark-group">
      <svg class="shield-icon" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span class="wordmark">MIRAGE-SHIELD</span>
    </div>

    <!-- Hero Stat -->
    <div class="hero-stat-block">
      <div class="hero-number">₹120+ Crores</div>
      <h1 class="hero-label">lost to <strong>Digital Arrest</strong> scams</h1>
    </div>

    <!-- Subtle Context Meta -->
    <footer class="source-meta">
      <span>Indian Cyber Crime Coordination Centre (I4C) Data</span>
      <span class="source-dot"></span>
      <span>Living Room Physical Defense</span>
    </footer>
  </main>
</body>
</html>
